<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>Checklist</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f0;
      --muted: rgba(240,240,240,0.4);
      --accent-green: #2ecc71;
      --accent-red: #e74c3c;
      --income: #2ecc71;
      --expense: #e74c3c;
      --transition: 0.5s cubic-bezier(0.4,0,0.2,1);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      transition: background var(--transition);
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV TABS ── */
    .tab-bar {
      display: flex;
      border-bottom: 0.5px solid var(--border);
      background: #0d0d0d;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 0;
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }

    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    /* ── PAGES ── */
    .page { display: none; padding: 1.5rem 1.25rem 5rem; max-width: 480px; margin: 0 auto; }
    .page.active { display: block; }

    /* ── CHECKLIST PAGE ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
    }

    .app-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .color-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.1em;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: 0.5px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      transition: border-color 0.2s, color 0.2s;
      text-transform: uppercase;
    }

    .color-toggle:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

    .toggle-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }
    .toggle-dot.on { background: var(--accent-green); }

    .progress-wrap {
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-green);
      border-radius: 2px;
      transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
      width: 0%;
    }

    .section-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .section-label {
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .tasks-card {
      background: var(--card);
      border: 0.5px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .task-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 0.5px solid var(--border);
      gap: 12px;
      transition: background 0.15s;
    }

    .task-item:last-child { border-bottom: none; }
    .task-item:hover { background: rgba(255,255,255,0.03); }

    .task-check {
      width: 20px; height: 20px;
      border-radius: 6px;
      border: 1.5px solid rgba(255,255,255,0.2);
      background: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.2s, background 0.2s;
    }

    .task-check.checked { background: var(--accent-green); border-color: var(--accent-green); }
    .task-check.checked::after {
      content: '';
      width: 5px; height: 9px;
      border: 2px solid #000;
      border-top: none; border-left: none;
      transform: rotate(45deg) translateY(-1px);
    }

    .task-text {
      flex: 1;
      font-size: 15px;
      color: var(--text);
      transition: color 0.2s;
    }

    .task-text.done { color: var(--muted); text-decoration: line-through; }

    .task-delete {
      background: none;
      border: none;
      color: rgba(255,255,255,0.15);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 2px 5px;
      border-radius: 4px;
      transition: color 0.2s;
    }
    .task-delete:hover { color: var(--accent-red); }

    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    .add-input {
      flex: 1;
      background: var(--card);
      border: 0.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .add-input::placeholder { color: var(--muted); }
    .add-input:focus { border-color: rgba(255,255,255,0.25); }

    .btn-add {
      background: rgba(255,255,255,0.07);
      border: 0.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 22px;
      width: 42px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .btn-add:hover { background: rgba(255,255,255,0.13); }

    .complete-banner {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.1em;
      color: var(--accent-green);
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .complete-banner.visible { opacity: 1; }

    .new-day-btn {
      width: 100%;
      padding: 14px;
      background: none;
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      cursor: pointer;
      text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .new-day-btn:hover { border-color: rgba(255,255,255,0.28); color: var(--text); background: rgba(255,255,255,0.03); }

    /* ── BANK PAGE ── */
    .balance-block {
      margin-bottom: 2rem;
    }

    .balance-label {
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .balance-amount {
      font-size: 42px;
      font-weight: 700;
      font-family: 'DM Mono', monospace;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .balance-amount.positive { color: var(--income); }
    .balance-amount.negative { color: var(--expense); }
    .balance-amount.zero { color: var(--text); }

    .txn-form {
      background: var(--card);
      border: 0.5px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .form-row:last-child { margin-bottom: 0; }

    .type-toggle {
      display: flex;
      border: 0.5px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .type-btn {
      flex: 1;
      padding: 9px 0;
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .type-btn.active-income { background: rgba(46,204,113,0.15); color: var(--income); }
    .type-btn.active-expense { background: rgba(231,76,60,0.15); color: var(--expense); }

    .field {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 0.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field::placeholder { color: var(--muted); }
    .field:focus { border-color: rgba(255,255,255,0.25); }

    .btn-log {
      width: 100%;
      padding: 11px;
      background: rgba(255,255,255,0.07);
      border: 0.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-log:hover { background: rgba(255,255,255,0.12); }

    .txn-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .print-btn {
      background: none;
      border: 0.5px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 12px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .print-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }

    .txn-list {
      background: var(--card);
      border: 0.5px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .txn-item {
      display: flex;
      align-items: center;
      padding: 13px 16px;
      border-bottom: 0.5px solid var(--border);
      gap: 12px;
    }
    .txn-item:last-child { border-bottom: none; }

    .txn-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .txn-dot.income { background: var(--income); }
    .txn-dot.expense { background: var(--expense); }

    .txn-info { flex: 1; min-width: 0; }

    .txn-source {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .txn-date {
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      margin-top: 2px;
    }

    .txn-amount {
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      font-weight: 500;
      flex-shrink: 0;
    }
    .txn-amount.income { color: var(--income); }
    .txn-amount.expense { color: var(--expense); }

    .txn-del {
      background: none;
      border: none;
      color: rgba(255,255,255,0.12);
      cursor: pointer;
      font-size: 18px;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.2s;
    }
    .txn-del:hover { color: var(--expense); }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      font-size: 12px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── PRINT STYLES ── */
    @media print {
      .tab-bar, .txn-form, .txn-header .print-btn, .txn-del, .new-day-btn, .add-row, .color-toggle { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
      .page { display: block !important; }
      #page-checklist { display: none !important; }
      .balance-amount { color: #000 !important; }
      .txn-amount.income { color: #1a6b3c !important; }
      .txn-amount.expense { color: #a32d2d !important; }
      .txn-source, .txn-date { color: #000 !important; }
    }
  </style>
</head>
<body>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-checklist" onclick="switchTab('checklist')">Checklist</button>
  <button class="tab-btn" id="tab-bank" onclick="switchTab('bank')">Bank</button>
</div>

<!-- CHECKLIST PAGE -->
<div class="page active" id="page-checklist">
  <div class="page-header">
    <span class="app-title">Checklist</span>
    <button class="color-toggle" onclick="toggleColor()">
      <span class="toggle-dot" id="toggleDot"></span>
      <span id="toggleLabel">Color off</span>
    </button>
  </div>

  <div class="progress-wrap">
    <div class="progress-fill" id="progressBar"></div>
  </div>

  <div class="section-row">
    <span class="section-label">Tasks</span>
    <span class="section-label" id="progressText">0 / 0</span>
  </div>

  <div class="tasks-card" id="taskList"></div>

  <div class="add-row" style="margin-top:10px;">
    <input class="add-input" id="addInput" placeholder="Add a task..." onkeydown="if(event.key==='Enter')addTask()" />
    <button class="btn-add" onclick="addTask()">+</button>
  </div>

  <div class="complete-banner" id="completeBanner">Complete — You can relax now</div>

  <button class="new-day-btn" onclick="newDay()">↺ &nbsp;Start New Day</button>
</div>

<!-- BANK PAGE -->
<div class="page" id="page-bank">
  <div class="balance-block">
    <div class="balance-label">Balance</div>
    <div class="balance-amount" id="balanceDisplay">$0.00</div>
  </div>

  <div class="txn-form">
    <div class="type-toggle">
      <button class="type-btn active-income" id="btn-income" onclick="setType('income')">+ Income</button>
      <button class="type-btn" id="btn-expense" onclick="setType('expense')">− Expense</button>
    </div>
    <div class="form-row">
      <input class="field" id="txnAmount" type="number" placeholder="Amount" min="0" step="0.01" />
    </div>
    <div class="form-row">
      <input class="field" id="txnSource" type="text" placeholder="Source (e.g. FilesAndFootage, rent)" />
    </div>
    <div class="form-row">
      <input class="field" id="txnNote" type="text" placeholder="Note (optional)" />
    </div>
    <button class="btn-log" onclick="logTxn()">Log Transaction</button>
  </div>

  <div class="txn-header">
    <span class="section-label">Transactions</span>
    <button class="print-btn" onclick="window.print()">Print for taxes</button>
  </div>

  <div class="txn-list" id="txnList"></div>
</div>

<script>
  // ── STATE ──
  let tasks = JSON.parse(localStorage.getItem('cl_tasks') || 'null');
  let colorOn = localStorage.getItem('cl_color') === 'true';
  let txns = JSON.parse(localStorage.getItem('cl_txns') || '[]');
  let txnType = 'income';

  if (!tasks) {
    tasks = [
      { id: 1, text: 'Film video', done: false },
      { id: 2, text: 'Edit and upload', done: false },
      { id: 3, text: 'Send FOIA requests', done: false },
      { id: 4, text: 'Study trading', done: false },
    ];
  }

  function save() {
    localStorage.setItem('cl_tasks', JSON.stringify(tasks));
    localStorage.setItem('cl_color', colorOn);
    localStorage.setItem('cl_txns', JSON.stringify(txns));
  }

  // ── TAB SWITCHING ──
  function switchTab(tab) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + tab).classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
  }

  // ── CHECKLIST ──
  function renderTasks() {
    const list = document.getElementById('taskList');
    list.innerHTML = '';

    tasks.forEach(t => {
      const row = document.createElement('div');
      row.className = 'task-item';

      const check = document.createElement('div');
      check.className = 'task-check' + (t.done ? ' checked' : '');
      check.onclick = () => toggleTask(t.id);

      const text = document.createElement('span');
      text.className = 'task-text' + (t.done ? ' done' : '');
      text.textContent = t.text;

      const del = document.createElement('button');
      del.className = 'task-delete';
      del.innerHTML = '&times;';
      del.onclick = () => deleteTask(t.id);

      row.appendChild(check);
      row.appendChild(text);
      row.appendChild(del);
      list.appendChild(row);
    });

    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const pct = total === 0 ? 0 : Math.round((done / total) * 100);

    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressText').textContent = done + ' / ' + total;

    const allDone = total > 0 && done === total;
    document.getElementById('completeBanner').className = 'complete-banner' + (allDone ? ' visible' : '');

    if (colorOn) {
      document.body.style.background = allDone ? '#051209' : '#1a0302';
      document.getElementById('progressBar').style.background = allDone ? '#2ecc71' : '#e74c3c';
    } else {
      document.body.style.background = '#0d0d0d';
      document.getElementById('progressBar').style.background = '#2ecc71';
    }

    document.getElementById('toggleDot').className = 'toggle-dot' + (colorOn ? ' on' : '');
    document.getElementById('toggleLabel').textContent = colorOn ? 'Color on' : 'Color off';
  }

  function toggleTask(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
    save(); renderTasks();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save(); renderTasks();
  }

  function addTask() {
    const input = document.getElementById('addInput');
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ id: Date.now(), text, done: false });
    input.value = '';
    save(); renderTasks();
  }

  function newDay() {
    tasks = tasks.map(t => ({ ...t, done: false }));
    save(); renderTasks();
  }

  function toggleColor() {
    colorOn = !colorOn;
    save(); renderTasks();
  }

  // ── BANK ──
  function setType(type) {
    txnType = type;
    document.getElementById('btn-income').className = 'type-btn' + (type === 'income' ? ' active-income' : '');
    document.getElementById('btn-expense').className = 'type-btn' + (type === 'expense' ? ' active-expense' : '');
  }

  function getBalance() {
    return txns.reduce((sum, t) => {
      return sum + (t.type === 'income' ? t.amount : -t.amount);
    }, 0);
  }

  function logTxn() {
    const amountRaw = parseFloat(document.getElementById('txnAmount').value);
    const source = document.getElementById('txnSource').value.trim();
    const note = document.getElementById('txnNote').value.trim();

    if (isNaN(amountRaw) || amountRaw <= 0 || !source) return;

    const amount = Math.round(amountRaw * 100) / 100;

    txns.unshift({
      id: Date.now(),
      type: txnType,
      amount,
      source,
      note,
      date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
    });

    document.getElementById('txnAmount').value = '';
    document.getElementById('txnSource').value = '';
    document.getElementById('txnNote').value = '';

    save(); renderBank();
  }

  function deleteTxn(id) {
    txns = txns.filter(t => t.id !== id);
    save(); renderBank();
  }

  function renderBank() {
    const balance = getBalance();
    const display = document.getElementById('balanceDisplay');
    display.textContent = '$' + Math.abs(balance).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    display.className = 'balance-amount ' + (balance > 0 ? 'positive' : balance < 0 ? 'negative' : 'zero');
    if (balance < 0) display.textContent = '-' + display.textContent;

    const list = document.getElementById('txnList');
    list.innerHTML = '';

    if (txns.length === 0) {
      list.innerHTML = '<div class="empty-state">No transactions yet</div>';
      return;
    }

    txns.forEach(t => {
      const row = document.createElement('div');
      row.className = 'txn-item';

      const dot = document.createElement('div');
      dot.className = 'txn-dot ' + t.type;

      const info = document.createElement('div');
      info.className = 'txn-info';
      info.innerHTML = `<div class="txn-source">${t.source}${t.note ? ' — ' + t.note : ''}</div><div class="txn-date">${t.date}</div>`;

      const amt = document.createElement('div');
      amt.className = 'txn-amount ' + t.type;
      amt.textContent = (t.type === 'income' ? '+' : '-') + '$' + t.amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      const del = document.createElement('button');
      del.className = 'txn-del';
      del.innerHTML = '&times;';
      del.onclick = () => deleteTxn(t.id);

      row.appendChild(dot);
      row.appendChild(info);
      row.appendChild(amt);
      row.appendChild(del);
      list.appendChild(row);
    });
  }

  renderTasks();
  renderBank();
</script>
</body>
</html>
