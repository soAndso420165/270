<script>
// Explicitly define the start date in Pacific Time (PT)
const START_DATE_STR = '2026-05-19'; 
const TOTAL_DAYS = 270;
const HOUR_OPTIONS = [6,7,8,9,10,11,12];

const DEFAULT_MILESTONES = [
  {id:'m1',icon:'📁',text:'10 FOIA requests filed'},
  {id:'m2',icon:'📁',text:'100 FOIA requests filed'},
  {id:'m3',icon:'🎬',text:'First FAF long-form video uploaded'},
  {id:'m4',icon:'📘',text:'FAF Facebook page created'},
  {id:'m5',icon:'📘',text:'FAF Facebook mirroring active'},
  {id:'m6',icon:'🎮',text:'StylesStacks channel created'},
  {id:'m7',icon:'🎮',text:'StylesStacks first video uploaded'},
  {id:'m8',icon:'👥',text:'100 subscribers on FAF'},
  {id:'m9',icon:'👥',text:'500 subscribers on FAF'},
  {id:'m10',icon:'👥',text:'1,000 subscribers on FAF'},
  {id:'m11',icon:'⏱️',text:'4,000 watch hours hit'},
  {id:'m12',icon:'💳',text:'AdSense application submitted'},
  {id:'m13',icon:'💵',text:'First $100 earned'},
  {id:'m14',icon:'💰',text:'First $1,000 month'},
  {id:'m15',icon:'💰',text:'First $5,000 month'},
  {id:'m16',icon:'🇪🇸',text:'Started learning Spanish'},
  {id:'m17',icon:'🇪🇸',text:'30 days of Spanish completed'},
  {id:'m18',icon:'🕹️',text:'First Roblox game prototype done'},
  {id:'m19',icon:'🕹️',text:'First Roblox game published'},
  {id:'m20',icon:'🥊',text:'30-day workout streak'},
  {id:'m21',icon:'⚖️',text:'Lost first 10 lbs'},
  {id:'m22',icon:'🏦',text:'$20,000 saved'},
  {id:'m23',icon:'📋',text:'Nevada LLC formed'},
  {id:'m24',icon:'🏠',text:'Moved to Henderson, NV'},
];

const DEFAULT_TASKS = [
  {id:'t1',text:'5–10 FOIA requests filed'},
  {id:'t2',text:'Swing trading study (1–2 hrs + notes)'},
  {id:'t3',text:'FAF editing / production'},
  {id:'t4',text:'FAF Facebook cross-post (if new video)'},
  {id:'t5',text:'StylesStacks — record or edit'},
  {id:'t6',text:'Roblox / coding learning'},
  {id:'t7',text:'Spanish practice'},
  {id:'t8',text:'Workout done'},
  {id:'t9',text:'Analytics & content optimization'},
  {id:'t10',text:'Relaxed only after all work done'},
];

const DEFAULT_PROJECTIONS = [
  {id:'p1',scenario:'🔴 Low (slow growth)',amount:'$6K–$12K'},
  {id:'p2',scenario:'🟡 Medium (consistent)',amount:'$36K–$60K'},
  {id:'p3',scenario:'🟠 High (FAF pops)',amount:'$120K–$240K'},
  {id:'p4',scenario:'🟢 Very High (viral)',amount:'$600K+'},
];

let state = {
  days:{}, income:0, milestones:{},
  milestoneList:null, taskList:null, projectionList:null,
  todayTasks:{}, todayTasksDate:null, todayHours:{},
};

function save(){ localStorage.setItem('grind270v2', JSON.stringify(state)); }

function load(){
  try {
    const raw = localStorage.getItem('grind270v2');
    if(raw) state = {...state, ...JSON.parse(raw)};
  } catch(e){}
  if(!state.milestoneList) state.milestoneList = DEFAULT_MILESTONES.map(m=>({...m}));
  if(!state.taskList) state.taskList = DEFAULT_TASKS.map(t=>({...t}));
  if(!state.projectionList) state.projectionList = DEFAULT_PROJECTIONS.map(p=>({...p}));
}

// Helper function to get the current date string in Pacific Time (YYYY-MM-DD format)
function getPTDateString(dateObj = new Date()) {
  return dateObj.toLocaleDateString('en-US', {
    timeZone: 'America/Los_Angeles',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).replace(/(\d+)\/(\d+)\/(\d+)/, '$3-$1-$2'); // Converts MM/DD/YYYY to YYYY-MM-DD
}

function getCurrentDay(){
  const todayStr = getPTDateString();
  const start = new Date(START_DATE_STR + 'T00:00:00-07:00'); // Standardized anchor point
  const currentPTDate = new Date(todayStr + 'T00:00:00-07:00');
  
  const diffTime = currentPTDate.getTime() - start.getTime();
  const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
  
  return Math.max(1, Math.min(diffDays, TOTAL_DAYS));
}

function formatMoney(n){
  if(n>=1000000) return '$'+(n/1000000).toFixed(1)+'M';
  if(n>=1000) return '$'+(n/1000).toFixed(1)+'K';
  return '$'+n.toLocaleString();
}

function showToast(msg, isRed){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isRed ? 'var(--red)' : 'var(--green)';
  t.style.color = isRed ? '#fff' : '#000';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
}

function addIncome(){
  const val = parseFloat(document.getElementById('income-input').value);
  if(isNaN(val)||val<=0) return;
  state.income += val;
  document.getElementById('income-input').value='';
  save(); render(); showToast('+ '+formatMoney(val)+' added 💰');
}

function setIncome(){
  const val = parseFloat(document.getElementById('income-input').value);
  if(isNaN(val)||val<0) return;
  state.income = val;
  document.getElementById('income-input').value='';
  save(); render(); showToast('Income set to '+formatMoney(val));
}

function toggleDay(d){
  const cur = state.days[d];
  if(cur==='complete') state.days[d]='failed';
  else if(cur==='failed') state.days[d]=null;
  else state.days[d]='complete';
  save(); render();
}

function selectHours(h){
  const today = getPTDateString();
  state.todayHours[today] = h;
  save(); render();
}

function getTodayHours(){
  return state.todayHours[getPTDateString()] || 0;
}

function toggleTask(id){
  const today = getPTDateString();
  if(state.todayTasksDate !== today){ state.todayTasks={}; state.todayTasksDate=today; }
  state.todayTasks[id] = !state.todayTasks[id];
  save(); render();
}

function markToday(){
  const day = getCurrentDay();
  if(state.days[day]==='complete') return;
  state.days[day]='complete';
  save(); render(); showToast('Day '+day+' LOCKED IN ✅');
}

function toggleMilestone(id){
  state.milestones[id] = !state.milestones[id];
  save(); render();
  if(state.milestones[id]) showToast('Milestone unlocked! 🎯');
}

function calcStreak(){
  let s=0, day=getCurrentDay();
  for(let i=day;i>=1;i--){ if(state.days[i]==='complete') s++; else break; }
  return s;
}

// MODAL
let currentModal = null;

function openModal(type){
  currentModal = type;
  document.getElementById('modal-overlay').classList.add('open');
  const title = document.getElementById('modal-title');
  const body = document.getElementById('modal-body');
  if(type==='milestones'){ title.textContent='Edit Milestones'; renderMilestonesModal(body); }
  else if(type==='tasks'){ title.textContent='Edit Daily Tasks'; renderTasksModal(body); }
  else if(type==='projections'){ title.textContent='Edit Projections'; renderProjectionsModal(body); }
}

function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); currentModal=null; save(); render(); }
function closeModalOutside(e){ if(e.target===document.getElementById('modal-overlay')) closeModal(); }

function renderMilestonesModal(body){
  body.innerHTML = `
    <div>${state.milestoneList.map(m=>`
      <div class="modal-item">
        <div class="modal-item-text">${m.icon} ${m.text}</div>
        <button class="del-btn" onclick="delMilestone('${m.id}')">×</button>
      </div>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <input class="modal-input" id="mi-icon" placeholder="Emoji" style="width:64px;flex-shrink:0;margin-bottom:0;">
      <input class="modal-input" id="mi-text" placeholder="New milestone..." style="margin-bottom:0;">
    </div>
    <div class="modal-btn-row">
      <button class="btn" onclick="addMilestone()" style="flex:1">ADD</button>
      <button class="btn ghost" onclick="closeModal()" style="flex:1">DONE</button>
    </div>`;
}

function delMilestone(id){ state.milestoneList=state.milestoneList.filter(m=>m.id!==id); renderMilestonesModal(document.getElementById('modal-body')); }
function addMilestone(){
  const icon = document.getElementById('mi-icon').value.trim()||'🎯';
  const text = document.getElementById('mi-text').value.trim();
  if(!text) return;
  state.milestoneList.push({id:'m'+Date.now(),icon,text});
  renderMilestonesModal(document.getElementById('modal-body'));
}

function renderTasksModal(body){
  body.innerHTML = `
    <div>${state.taskList.map(t=>`
      <div class="modal-item">
        <div class="modal-item-text">${t.text}</div>
        <button class="del-btn" onclick="delTask('${t.id}')">×</button>
      </div>`).join('')}</div>
    <input class="modal-input" id="ti-text" placeholder="New task..." style="margin-top:12px;">
    <div class="modal-btn-row">
      <button class="btn" onclick="addTask()" style="flex:1">ADD</button>
      <button class="btn ghost" onclick="closeModal()" style="flex:1">DONE</button>
    </div>`;
}

function delTask(id){ state.taskList=state.taskList.filter(t=>t.id!==id); renderTasksModal(document.getElementById('modal-body')); }
function addTask(){
  const text = document.getElementById('ti-text').value.trim();
  if(!text) return;
  state.taskList.push({id:'t'+Date.now(),text});
  renderTasksModal(document.getElementById('modal-body'));
}

function renderProjectionsModal(body){
  body.innerHTML = `
    <div>${state.projectionList.map(p=>`
      <div class="modal-item">
        <div class="modal-item-text">${p.scenario}</div>
        <input class="proj-amount-input" value="${p.amount}" onchange="updateProj('${p.id}',this.value)">
        <button class="del-btn" onclick="delProj('${p.id}')">×</button>
      </div>`).join('')}</div>
    <div style="font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:14px;margin-bottom:8px;text-transform:uppercase;">Add new scenario</div>
    <input class="modal-input" id="pi-scenario" placeholder="🔵 Scenario label...">
    <input class="modal-input" id="pi-amount" placeholder="Amount (e.g. $50K)">
    <div class="modal-btn-row">
      <button class="btn" onclick="addProj()" style="flex:1">ADD</button>
      <button class="btn ghost" onclick="closeModal()" style="flex:1">DONE</button>
    </div>`;
}

function delProj(id){ state.projectionList=state.projectionList.filter(p=>p.id!==id); renderProjectionsModal(document.getElementById('modal-body')); }
function updateProj(id,val){ const p=state.projectionList.find(p=>p.id===id); if(p) p.amount=val; }
function addProj(){
  const scenario = document.getElementById('pi-scenario').value.trim();
  const amount = document.getElementById('pi-amount').value.trim();
  if(!scenario||!amount) return;
  state.projectionList.push({id:'p'+Date.now(),scenario,amount});
  renderProjectionsModal(document.getElementById('modal-body'));
}

function render(){
  const day = getCurrentDay();
  const completed = Object.values(state.days).filter(v=>v==='complete').length;
  const streak = calcStreak();
  const pct = Math.round((completed/TOTAL_DAYS)*100);
  const todayHrs = getTodayHours();

  document.getElementById('current-day-stat').textContent = day;
  document.getElementById('days-left-stat').textContent = Math.max(0,TOTAL_DAYS-day+1);
  document.getElementById('streak-stat').textContent = streak;
  document.getElementById('completed-stat').textContent = completed;
  document.getElementById('progress-pct').textContent = pct+'%';
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('income-display').textContent = formatMoney(state.income);

  document.getElementById('today-day-header').textContent = 'DAY '+day;
  document.getElementById('today-phase-label').textContent =
    day<=90 ? 'GRIND PHASE · Days 1–90 · 6–12 hrs/day' :
    day<=180 ? 'GROWTH PHASE · Days 91–180 · 6–12 hrs/day' :
    'SCALE PHASE · Days 181–270 · 6–12 hrs/day';

  document.getElementById('hours-badge').textContent = todayHrs ? todayHrs+' HRS' : '— HRS';

  document.getElementById('hours-selector').innerHTML = HOUR_OPTIONS.map(h=>
    `<div class="hour-chip ${todayHrs===h?'selected':''}" onclick="selectHours(${h})">${h}h</div>`
  ).join('');

  const today = getPTDateString();
  if(state.todayTasksDate!==today) state.todayTasks={};
  document.getElementById('daily-checklist').innerHTML = state.taskList.map(t=>`
    <div class="checklist-item ${state.todayTasks[t.id]?'checked':''}" onclick="toggleTask('${t.id}')">
      <div class="check-box">${state.todayTasks[t.id]?'✓':''}</div>
      <div class="check-label">${t.text}</div>
    </div>`).join('');

  const todayDone = state.days[day]==='complete';
  const btn = document.getElementById('mark-day-btn');
  btn.textContent = todayDone ? '✅ DAY '+day+' COMPLETE' : '✅ MARK DAY COMPLETE';
  btn.style.opacity = todayDone ? '0.5' : '1';

  document.getElementById('milestones-list').innerHTML = state.milestoneList.map(m=>`
    <div class="milestone ${state.milestones[m.id]?'done':''}" onclick="toggleMilestone('${m.id}')">
      <div class="milestone-check">${state.milestones[m.id]?'✓':''}</div>
      <div class="milestone-text">${m.icon} ${m.text}</div>
    </div>`).join('');

  document.getElementById('projections-list').innerHTML = state.projectionList.map(p=>`
    <div class="proj-row">
      <span class="proj-scenario">${p.scenario}</span>
      <span class="proj-amount">${p.amount}</span>
    </div>`).join('');

  ['phase1','phase2','phase3'].forEach((phase,pi)=>{
    const start = pi*90+1;
    let html='';
    for(let d=start;d<=start+89;d++){
      const s=state.days[d];
      const isToday=d===day;
      const cls=['day-dot',s==='complete'?'complete':'',s==='failed'?'failed':'',isToday?'today':''].filter(Boolean).join(' ');
      const label=s==='complete'?'✓':s==='failed'?'✗':d<=day?d:'';
      html+=`<div class="${cls}" onclick="toggleDay(${d})" title="Day ${d}">${label}</div>`;
    }
    document.getElementById('grid-'+phase).innerHTML=html;
  });
}

load();
render();
</script>
