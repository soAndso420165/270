<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="270 GRIND">
<title>270 GRIND</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --green:#00ff88;
  --red:#ff3b3b;
  --gold:#ffd700;
  --bg:#0a0a0a;
  --card:#111;
  --border:#222;
  --text:#f0f0f0;
  --muted:#555;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Space Mono',monospace;
  min-height:100vh;
}

/* layout */
.container{max-width:480px;margin:auto;padding:20px 16px 100px}

.header{text-align:center;padding:20px;border-bottom:1px solid var(--border)}
.header h1{
  font-family:'Bebas Neue';
  font-size:60px;
  background:linear-gradient(90deg,#fff,var(--gold),#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.subtitle{font-size:10px;color:var(--muted)}
.motto{font-size:11px;color:var(--green);margin-top:6px}

/* stats */
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}
.stat{
  background:var(--card);
  padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
  text-align:center;
}
.stat h3{color:var(--gold);font-size:22px}

/* sections */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  margin-top:12px;
}

.title{
  font-size:10px;
  color:var(--muted);
  letter-spacing:2px;
  margin-bottom:10px;
}

/* tasks */
.task{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  font-size:12px;
}
.task:last-child{border-bottom:none}

.check{
  width:18px;height:18px;
  border:1px solid var(--muted);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:10px;
  border-radius:4px;
}

.task.done{
  color:var(--muted);
  text-decoration:line-through;
}
.task.done .check{
  background:var(--green);
  border-color:var(--green);
  color:#000;
}

.btn{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:var(--green);
  font-weight:700;
  cursor:pointer;
}

/* nav */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  background:#000;
  border-top:1px solid var(--border);
}
.nav button{
  flex:1;
  padding:12px;
  background:none;
  border:none;
  color:var(--muted);
}
.nav button.active{color:var(--gold)}

.view{display:none}
.view.active{display:block}
</style>
</head>

<body>

<div class="container">

<!-- HOME -->
<div class="view active" id="home">

  <div class="header">
    <h1>270 GRIND</h1>
    <div class="subtitle">FAF Empire</div>
    <div class="motto">No one saves me. I build it.</div>
  </div>

  <div class="stats">
    <div class="stat">
      <h3 id="day">1</h3>
      <p>DAY</p>
    </div>
    <div class="stat">
      <h3 id="streak">0</h3>
      <p>STREAK</p>
    </div>
  </div>

  <div class="card">
    <div class="title">DAILY CORE</div>

    <div class="task" onclick="toggle('foia')">
      <span>📁 FOIA Requests</span><div class="check" id="foia"></div>
    </div>

    <div class="task" onclick="toggle('faf')">
      <span>🎬 FAF Work</span><div class="check" id="faf"></div>
    </div>

    <div class="task" onclick="toggle('trade')">
      <span>📈 Swing Trading</span><div class="check" id="trade"></div>
    </div>

    <!-- NEW ADDITIONS (your request) -->
    <div class="task" onclick="toggle('roblox')">
      <span>🎮 Roblox Learning</span><div class="check" id="roblox"></div>
    </div>

    <div class="task" onclick="toggle('styles')">
      <span>🎥 StylesStacks</span><div class="check" id="styles"></div>
    </div>

    <div class="task" onclick="toggle('fb')">
      <span>📘 FilesAndFootage</span><div class="check" id="fb"></div>
    </div>

    <button class="btn" onclick="reset()">RESET DAY</button>
  </div>

</div>

</div>

<!-- NAV -->
<div class="nav">
  <button class="active" onclick="show('home')">HOME</button>
</div>

<script>
let state = JSON.parse(localStorage.getItem("grind270")) || {
  tasks:{},
  streak:0,
  lastReset:null
};

const tasks = ["foia","faf","trade","roblox","styles","fb"];

function save(){
  localStorage.setItem("grind270",JSON.stringify(state));
}

function toggle(id){
  state.tasks[id] = !state.tasks[id];
  save();
  render();
}

function reset(){
  state.tasks = {};
  save();
  render();
}

function render(){

  tasks.forEach(id=>{
    const el = document.getElementById(id);
    const taskEl = el.parentElement;

    if(state.tasks[id]){
      el.innerHTML="✓";
      taskEl.classList.add("done");
    } else {
      el.innerHTML="";
      taskEl.classList.remove("done");
    }
  });

  document.getElementById("streak").innerText = state.streak || 0;
  document.getElementById("day").innerText = 1;
}

function show(v){
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
  document.getElementById(v).classList.add("active");
}

render();
</script>

</body>
</html>
